# PR triage (core ADR-0068, ADR-0077, ADR-0078, core docs/specs/pr-triage.md):
# this caller runs on pull_request_target so the base risk list and trusted core
# workflow execute. It does not run a PR branch. It checks out nothing. It adds
# the level labels level:L1 to level:L4, adds risk:high at L1 and L2, and
# removes ready-for-human when the head commit moves. It is not a required
# check. The repository must have the risk:high label, or this job fails; a
# missing level label only warns.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # core#246 (frostyard/core main, 2026-11-14)

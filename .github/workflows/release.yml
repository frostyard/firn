# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write
  # packages: write
  # issues: write
  # id-token and attestations let actions/attest-build-provenance sign the
  # release artifacts with GitHub's Sigstore instance (verify with
  # `gh attestation verify <artifact> --repo frostyard/firn`).
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # mise.toml and mise.lock are the single source of every tool pin
      # (core ADR-0043): this installs exactly the locked golangci-lint,
      # checksum-verified, the same way a developer's `mise install` and the
      # test workflow's lint job do, so publication cannot drift ahead of the
      # gate that other pipelines already enforce.
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: golangci-lint
          cache: true

      - name: Verify
        run: make verify

      # More assembly might be required: Docker logins, GPG, etc.
      # It all depends on your needs.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser-pro
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro' distribution
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # Build provenance: binds each release asset and checksums.txt to this
      # tag's workflow run. frostyard/apt-publisher refuses a firn .deb whose
      # attestation does not name refs/tags/<this tag> from a GitHub-hosted
      # runner, so it must run before the publication request below.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      # The .deb files are published by frostyard/apt-publisher, the single
      # Debian writer (frostyard/core ADR-0055, firn ADR-0017). It downloads
      # every .deb asset of this release, verifies its build provenance,
      # publishes it to https://repository.frostyard.org/debian/, and then
      # dispatches `build` to frostyard/snosi once the packages are
      # installable (core ADR-0056). Not continue-on-error: if this request
      # fails, nothing was published and the release run must fail.
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}'

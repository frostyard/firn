name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

jobs:
  gate:
    name: Repository gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # mise.toml and mise.lock are the single source of every tool pin
      # (core ADR-0043): this installs exactly the locked golangci-lint,
      # checksum-verified, the same way a developer's `mise install` and a
      # Snowcat worker's target preparation do, so the three cannot drift.
      # Go still comes from actions/setup-go above (go.mod's toolchain line).
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: golangci-lint
          cache: true

      # make ci is the credential-free gate (core ADR-0043/ADR-0022): verify
      # (tidy diff, gofmt, lint, vet, tests) plus coverage, the race
      # detector, and cross-arch builds, replacing the lint/verify/race/build
      # jobs this workflow ran individually before.
      - name: Run canonical gate
        run: make ci

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov's tokenless OIDC upload needs this job-scoped permission.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        # Cover ./internal/... and ./cmd/... so the uploaded profile matches
        # Codecov's measurement scope (codecov.yml does not ignore cmd/).
        run: go test -v ./internal/... ./cmd/... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  e2e-harness-syntax:
    name: E2E Harness Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # firn: root-requiring E2E harnesses live in test/e2e-*.sh and run
      # outside hosted CI (KVM required). This job only checks shell syntax.
      - name: Check E2E harness syntax
        run: bash -n test/e2e-ab.sh test/e2e-bootc-secure.sh test/e2e-bootc.sh test/e2e-tui.sh

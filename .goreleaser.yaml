# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
pro: true

project_name: firn

metadata:
  description: firn - the bootc installer for snosi images
  homepage: "https://github.com/frostyard/firn"
  license: GPL-3.0-only
  maintainers:
    - "Brian Ketelsen <bketelsen@gmail.com>"

git:
  # Allow non-semver tags for snapshot builds
  ignore_tags:
    - continuous

snapshot:
  # Use a static version template that doesn't require parsing existing tags
  version_template: "{{ .ShortCommit }}-snapshot"

gomod:
  proxy: false

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh
    - ./scripts/manpages.sh


builds:
  - #
    # ID of the build.
    #
    # Default: Project directory name.
    id: "firn"
    binary: firn

    # Path to main.go file or main package.
    # Notice: when used with `gomod.proxy`, this must be a package.
    #
    # Default: `.`.
    main: ./cmd/firn-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }} -X main.builtBy=goreleaser

  # The graphical installer is the nested module in gui/ (ADR-0021), which
  # needs the Go of gui/go.mod (1.27.4; mygo needs Go 1.27.3 or later). The
  # workflows set up the root module's Go and actions/setup-go exports
  # GOTOOLCHAIN=local, so this build sets GOTOOLCHAIN=auto to let that go
  # fetch gui/go.mod's toolchain. mygo loads GTK, Pango and Cairo with
  # dlopen, so it cross-builds without cgo.
  - id: "firn-gui"
    binary: firn-gui
    dir: gui
    main: ./cmd/firn-gui
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=auto
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }} -X main.builtBy=goreleaser

# Each archive and package names its build ids: without them every one would
# take both binaries.
archives:
  - id: firn
    ids:
      - firn
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES
  - id: firn-gui
    ids:
      - firn-gui
    name_template: "firn-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - gui/THIRD_PARTY_NOTICES
      - gui/data/firn-gui.desktop
      - gui/data/org.frostyard.firn.gui.policy


checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: "^.*feat\\(deps\\)*:+.*$"
      order: 300
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Documentation updates"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: Other work
      order: 9999

nfpms:
  - id: firn
    ids:
      - firn
    file_name_template: "{{ .ConventionalFileName }}"
    package_name: frostyard-firn
    description: |-
      The bootc installer for snosi images.
    license: GPL-3.0-only
    contents:
      - src: ./completions/firn.bash
        dst: /etc/bash_completion.d/firn
      - src: ./completions/firn.fish
        dst: /usr/share/fish/completions/firn.fish
      - src: ./completions/firn.zsh
        dst: /usr/share/zsh/site-functions/_firn
      - src: ./manpages/firn.1.gz
        dst: /usr/share/man/man1/firn.1.gz
      # License texts and notices (ADR-0023). The paths differ because each
      # format has its own convention: Debian Policy 12.5 names
      # /usr/share/doc/<package>/copyright; rpm marks the files %license
      # (nfpm's type: license) under /usr/share/licenses/<package>/, where
      # Alpine puts them too. NOTICE holds firn's copyright holders and
      # attribution; THIRD_PARTY_NOTICES (generated by
      # scripts/third-party-notices.mjs) the texts of the compiled-in modules.
      - src: ./LICENSE
        dst: /usr/share/doc/frostyard-firn/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/doc/frostyard-firn/NOTICE
        packager: deb
        file_info:
          mode: 0644
      - src: ./THIRD_PARTY_NOTICES
        dst: /usr/share/doc/frostyard-firn/THIRD_PARTY_NOTICES
        packager: deb
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/licenses/frostyard-firn/LICENSE
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/licenses/frostyard-firn/NOTICE
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: ./THIRD_PARTY_NOTICES
        dst: /usr/share/licenses/frostyard-firn/THIRD_PARTY_NOTICES
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/licenses/frostyard-firn/LICENSE
        packager: apk
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/licenses/frostyard-firn/NOTICE
        packager: apk
        file_info:
          mode: 0644
      - src: ./THIRD_PARTY_NOTICES
        dst: /usr/share/licenses/frostyard-firn/THIRD_PARTY_NOTICES
        packager: apk
        file_info:
          mode: 0644
    formats:
      - deb
      - rpm
      - apk

  # The binary goes alone into /usr/libexec/firn-gui, behind a /usr/bin
  # symlink: at startup mygo deletes every ".*.old-*" entry beside its
  # executable (its self-updater's leftovers), which must never be a shared
  # directory such as /usr/bin. Like frostyard-firn, the package declares no
  # Depends: GTK 3, Pango and Cairo are loaded with dlopen, and the live
  # desktop image provides them, pkexec and the install tools.
  - id: firn-gui
    ids:
      - firn-gui
    file_name_template: "{{ .ConventionalFileName }}"
    package_name: frostyard-firn-gui
    description: |-
      The graphical installer for snosi images.
    license: GPL-3.0-only
    bindir: /usr/libexec/firn-gui
    contents:
      - src: /usr/libexec/firn-gui/firn-gui
        dst: /usr/bin/firn-gui
        type: symlink
      - src: ./gui/data/firn-gui.desktop
        dst: /usr/share/applications/firn-gui.desktop
        file_info:
          mode: 0644
      # firn-gui re-runs itself through pkexec; this action names it and
      # asks for an administrator's password every time.
      - src: ./gui/data/org.frostyard.firn.gui.policy
        dst: /usr/share/polkit-1/actions/org.frostyard.firn.gui.policy
        file_info:
          mode: 0644
      # License texts and notices (ADR-0023). The paths differ because each
      # format has its own convention: Debian Policy 12.5 names
      # /usr/share/doc/<package>/copyright; rpm marks the files %license
      # (nfpm's type: license) under /usr/share/licenses/<package>/, where
      # Alpine puts them too. NOTICE holds firn's copyright holders and
      # attribution; gui/THIRD_PARTY_NOTICES (generated by
      # scripts/third-party-notices.mjs) the texts of the compiled-in modules.
      - src: ./LICENSE
        dst: /usr/share/doc/frostyard-firn-gui/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/doc/frostyard-firn-gui/NOTICE
        packager: deb
        file_info:
          mode: 0644
      - src: ./gui/THIRD_PARTY_NOTICES
        dst: /usr/share/doc/frostyard-firn-gui/THIRD_PARTY_NOTICES
        packager: deb
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/licenses/frostyard-firn-gui/LICENSE
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/licenses/frostyard-firn-gui/NOTICE
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: ./gui/THIRD_PARTY_NOTICES
        dst: /usr/share/licenses/frostyard-firn-gui/THIRD_PARTY_NOTICES
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/licenses/frostyard-firn-gui/LICENSE
        packager: apk
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/licenses/frostyard-firn-gui/NOTICE
        packager: apk
        file_info:
          mode: 0644
      - src: ./gui/THIRD_PARTY_NOTICES
        dst: /usr/share/licenses/frostyard-firn-gui/THIRD_PARTY_NOTICES
        packager: apk
        file_info:
          mode: 0644
    formats:
      - deb
      - rpm
      - apk

release:
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/frostyard/{{ .ProjectName }}/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    _Released with [GoReleaser Pro](https://goreleaser.com/pro)!_

nightly:
  # Allows you to change the version of the generated nightly release.
  #
  # Note that some pipes require this to be semantic version compliant (nfpm,
  # for example).
  #
  # Default: `{{ incpatch .Version }}-{{ .ShortCommit }}-nightly`.
  # Templates: allowed.
  version_template: "{{ incmajor .Version }}-dev"

  # Tag name to create if publish_release is enabled.
  tag_name: dev

  # Whether to publish a release or not.
  # Only works on GitHub.
  publish_release: true

  # Whether to delete previous pre-releases for the same `tag_name` when
  # releasing.
  # This allows you to keep a single pre-release.
  keep_single_release: true

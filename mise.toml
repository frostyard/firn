# Tool pins for this repository (core ADR-0043, Snowcat ADR-0076).
# Go comes from go.mod — never pin it here. Every tool the gates invoke
# beyond the worker base image is listed; mise.lock carries the checksums.
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
golangci-lint = "2.15.0"
# Node runs the template gate that `make verify` includes. The gate needs
# Node 22 or later; this is the Node 24 LTS line.
node = "24.22.2"

# yaml-language-server: $schema=https://jaywhj.github.io/mkdocs-materialx/schema.json
# The firn documentation site: ProperDocs with the MaterialX theme. The
# layout comes from frostyard/core ADR-0070. `make site` builds it into
# site/dist; `make site-serve` previews it at
# http://127.0.0.1:8000/firn/.

site_name: firn
site_url: https://frostyard.github.io/firn/
site_description: Installer for frostyard images.
site_author: Frostyard
copyright: firn is GPL-3.0-only licensed. Part of <a href="https://frostyard.org">Frostyard</a>.

repo_name: frostyard/firn
repo_url: https://github.com/frostyard/firn
edit_uri: edit/main/site/content/

docs_dir: content
site_dir: dist

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: getting-started/install.md
      - Your first install: getting-started/first-install.md
  - Guides:
      - Terminal wizard: guides/terminal-wizard.md
      - Graphical installer: guides/graphical-installer.md
      - Headless install with a recipe: guides/headless-install.md
      - Preflight checks: guides/preflight.md
      - Disks and encryption: guides/disks-and-encryption.md
      - Secure Boot: guides/secure-boot.md
      - Flatpaks: guides/flatpaks.md
  - Concepts:
      - How firn works: concepts/how-it-works.md
      - Trust model: concepts/trust.md
  - Reference:
      - Commands: reference/cli.md
      - Recipe: reference/recipe.md
      - Progress events: reference/progress.md
      - Troubleshooting: reference/troubleshooting.md
  - Contributing:
      - Build from source: contributing/build.md

theme:
  name: materialx
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  font: false
  # Frostyard surfaces are solid; no frosted-glass header.
  topbar_style: primary
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search

extra_css:
  - stylesheets/frostyard.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/frostyard/firn
      name: firn on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
